# Per-project workflow knobs, read by .claude/hooks/*. Editing this file is how you
# port the template to a new repo. Shell-sourced, so use plain VAR="value" lines.
#
# Global escape hatch: `export WORKFLOW_HOOKS_DISABLE=1` disables every workflow hook.
# Per-machine overrides go in .claude/workflow.local.conf (gitignored, sourced last).

# --- git-guard (PreToolUse on Bash) ---
# COMMIT_POLICY: deny  = Claude never runs git writes (the user commits)
#                ask   = every git write asks the user (one keypress = authorization)  [default]
#                allow = git writes pass (checks below still apply)
COMMIT_POLICY="ask"

SUBAGENT_GIT_WRITE="deny"    # subagents never run git writes, regardless of policy
FORBID_IDENTITY_OVERRIDE=1   # block -c user.email / -c user.name / --author= / GIT_AUTHOR_*
FORBID_COAUTHOR=1            # block Co-Authored-By trailers
DENY_INDEX_WIDE_ADD=1       # block `git add -A` / `--all` / `git add .`
REQUIRE_COMMIT_PATHSPEC=0   # 1 => `git commit` must name paths (--amend / --only exempt)

# --- docker-route (PreToolUse on Bash) ---
# Dormant until EXEC_WRAPPER is set. DOCKER_ROUTING: block | warn | off
EXEC_WRAPPER=""              # e.g. "docker/exec.sh"; empty disables routing
DOCKER_ROUTING="block"
CONTAINER_BINS="cargo rustc rustfmt clippy npm pnpm yarn node pytest python pip go make cmake ctest"

# --- format-dispatch (PostToolUse on Edit|Write|NotebookEdit) ---
# Dormant until FORMAT_CMD is set. FORMAT_MODE: fix | off
# FORMAT_CMD must format {FILE} in place; {FILE} is replaced with the edited path.
FORMAT_MODE="off"
FORMAT_EXTENSIONS="rs py sh cc cpp h hpp"
FORMAT_CMD=""               # e.g. ./docker/exec.sh "FORMAT_SKIP_CLEAN_CHECK=1 ./format/format.sh --file {FILE}"

# --- comment-lint (PostToolUse on Edit|Write) ---
# The comment-style skill (auto-loaded on source edits) is the primary mechanism;
# this hook is an opt-in stricter tripwire. COMMENT_LINT: warn | off
COMMENT_LINT="off"
COMMENT_LINT_EXTENSIONS="rs py sh cc cpp h hpp js ts go"
COMMENT_BANNED_REGEX='(//|#)[[:space:]]*(added |fix(es|ed) |tried |previously|as discussed|changed for)'
